name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        run: go build -o bin/challenge-deps ./cmd/challenge-deps

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: challenge-deps
          path: bin/challenge-deps

  generate-graph:
    name: Generate Dependency Graph
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build tool
        run: go build -o bin/challenge-deps ./cmd/challenge-deps

      - name: Generate dependency graph
        id: generate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Run the tool and capture output
          ./bin/challenge-deps \
            --repo . \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --format markdown > graph.md || echo "Error generating graph (exit code: $?)"

          # Display the graph
          cat graph.md

      - name: Comment PR with graph
        uses: actions/github-script@v8
        if: success()
        with:
          script: |
            const fs = require('fs');

            let graph = '';
            try {
              graph = fs.readFileSync('graph.md', 'utf8');
            } catch (err) {
              graph = 'Failed to generate dependency graph';
            }

            const body = '## Challenge Dependency Graph\n\n' +
              'This shows the dependencies between challenges after merging this PR.\n\n' +
              graph + '\n\n' +
              '---\n' +
              '*Generated automatically by challenge-deps*';

            // Check if there's already a comment from this action
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Challenge Dependency Graph')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
