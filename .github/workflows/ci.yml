name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: [takumi-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history for git operations

      - uses: flatt-security/setup-takumi-guard-npm@3c4ad0e8c9e81d0efbccff304adac60e42e3f32d # v1.1.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Build binary
        run: go build -o bin/challenge-deps ./cmd/challenge-deps

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: challenge-deps
          path: bin/challenge-deps

  generate-graph:
    name: Generate Dependency Graph
    runs-on: [takumi-runner]
    needs: ci
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: challenge-deps
          path: bin

      - name: Make binary executable
        run: chmod +x bin/challenge-deps

      - name: Generate dependency graph
        id: generate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Run the tool and capture output
          ./bin/challenge-deps \
            --repo . \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --format markdown > graph.md || echo "Error generating graph (exit code: $?)"

          # Display the graph
          cat graph.md

      - name: Comment PR with graph
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: success()
        with:
          script: |
            const fs = require('fs');

            let graph = '';
            try {
              graph = fs.readFileSync('graph.md', 'utf8');
            } catch (err) {
              graph = 'Failed to generate dependency graph';
            }

            const body = '## Challenge Dependency Graph\n\n' +
              'This shows the dependencies between challenges after merging this PR.\n\n' +
              graph + '\n\n' +
              '---\n' +
              '*Generated automatically by challenge-deps*';

            // Check if there's already a comment from this action
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Challenge Dependency Graph')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
